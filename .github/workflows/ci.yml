name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check netie_control tests
      - name: Tests
        run: python -m pytest tests/ -q --tb=short

  wheel:
    # Editable installs read the source tree, so they cannot see packaging gaps.
    # Build the wheel, install it clean, boot it, and check the page has its CSS.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Imprint the commit, then build wheel
        run: |
          python -m netie_control.imprint "$(git rev-parse HEAD)"
          pip wheel --no-deps -w dist .
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
      - name: Boot installed wheel and probe
        working-directory: /tmp
        run: |
          /tmp/venv/bin/python -m uvicorn netie_control.app:app --port 8040 &
          for i in $(seq 1 30); do curl -sf localhost:8040/healthz && break; sleep 1; done
          curl -sf localhost:8040/healthz | grep -q '"plane":4'
          want="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          curl -sf localhost:8040/healthz > healthz.json
          python3 -c "import json,sys; b=json.load(open('healthz.json'))['build']; sys.exit(0 if b['commit']=='$want' and b['source']=='wheel imprint' else 'imprint mismatch: %r want $want' % b)"
          curl -sf localhost:8040/ -o page.html
          grep -q "is-unread" page.html
          if grep -q "body{background:#050506;color:#e7ebe2}" page.html; then
            echo "page served fallback CSS: static/control.css missing from wheel"; exit 1
          fi
          for p in /v1/secrets /v1/route /v1/goal /v1/run; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "localhost:8040$p")
            test "$code" = "405" || { echo "$p answered $code, want 405"; exit 1; }
          done
