[project]
name = "netie-control"
version = "0.1.0"
description = "Netie Control - operator shell. Plane 4. Displays and launches; holds no keys, decides no route."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["netie_control*"]

[tool.ruff]
line-length = 100
